<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إلى حبيبتي</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="hearts"></canvas>

<section class="hero">
  <p class="small">من قلبي إلى قلبك</p>
  <h1 id="typed"></h1>
  <div class="counter">
    <div><b id="d">0</b><span>يوم</span></div>
    <div><b id="h">0</b><span>ساعة</span></div>
    <div><b id="m">0</b><span>دقيقة</span></div>
    <div><b id="s">0</b><span>ثانية</span></div>
  </div>
  <p class="small">وقت حبنا معًا</p>
  <button id="love">اضغطي هنا 💌</button>
</section>

<section class="gallery">
  <h2>ذكرياتنا</h2>
  <div class="cards">
    <figure class="card"><img src="./assets/img.jpg" alt="صورة 1"><figcaption>أجمل لحظة</figcaption></figure>
    <figure class="card"><img src="./assets/img2.jpeg" alt="صورة 2"><figcaption>ضحكتك</figcaption></figure>
    <figure class="card"><img src="./assets/IMG_7563.JPG" alt="صورة 3"><figcaption>يوم لا ينسى</figcaption></figure>
    <figure class="card"><img src="./assets/IMG_7637.PNG" alt="صورة 4"><figcaption>أنتِ الأمان</figcaption></figure>
    <figure class="card"><img src="./assets/WhatsApp Image 2026-11-04 at 5.23.21 PM.jpeg" alt="صورة 5"><figcaption>وكل يوم أحبك أكتر</figcaption></figure>
  </div>
</section>

<section class="letter">
  <h2>رسالة لكِ</h2>
  <p id="msg">حبيبتي، أنتِ أجمل شيء حصل في حياتي. كل يوم معكِ هدية، وكل لحظة بجانبك أمان. بحبك أكتر مما تتخيلي.</p>
</section>

<div id="pop" class="pop"><div class="box"><h3>بحبك ❤️</h3><p>أنتِ كل دنيتي</p><button id="close">حاضر 💖</button></div></div>

<script src="script.js"></script>
</body>
</html>
